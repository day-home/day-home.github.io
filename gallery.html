<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="main.png">
  <link rel="stylesheet" href="gallery.css">
  <title>GALLERY</title>
</head>

<body>
  <!-- 이미지 확대 모달 -->
  <div class="modal" id="imageModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="모달 닫기">×</button>
    <img id="modalImage" alt="확대된 이미지">
  </div>

  <main>
    <h1>GALLERY</h1>

    <div class="buttons" role="group" aria-label="갤러리 보기 모드">
      <button class="mode-btn active" data-mode="grid" aria-label="그리드 모드로 전환">
        GRID
      </button>
      <button class="mode-btn" data-mode="scroll" aria-label="스크롤 모드로 전환">
        SCROLL
      </button>
      <button class="mode-btn" data-mode="slide" aria-label="슬라이드 모드로 전환">
        SLIDE
      </button>
    </div>

    <!-- 갤러리 컨테이너 (gallery.js에서 동적으로 생성) -->
    <div class="gallery grid" id="gallery" role="region" aria-label="이미지 갤러리">
      <!-- 이미지는 gallery.js의 GALLERY_IMAGES 배열에서만 관리됩니다 -->
    </div>

    <div class="slide-info" id="slideInfo" style="display: none;">
      <span id="currentSlide">1</span> / <span id="totalSlides">5</span>
    </div>
  </main>

  <script src="gallery.js"></script>
</body>

</html>
