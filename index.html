<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Day의 드림홈 - 드림, 로그, 갤러리를 공유하는 공간">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Serif+KR:wght@300;500;700&display=swap"
    rel="stylesheet">

  <title>Dream home</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      position: relative;
      min-height: 100vh;
      padding: 34px 20px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 190, 220, 0.45), transparent 28%),
        radial-gradient(circle at 85% 20%, rgba(255, 226, 240, 0.9), transparent 30%),
        radial-gradient(circle at 50% 95%, rgba(255, 210, 232, 0.65), transparent 35%),
        #fff7fb;
      color: #444;
      font-family: 'Gowun Dodum', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 179, 217, 0.16) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 179, 217, 0.16) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at center, black, transparent 75%);
      opacity: 0.55;
    }

    body::after {
      content: "✦";
      position: fixed;
      right: 10vw;
      top: 12vh;
      color: rgba(255, 126, 182, 0.35);
      font-size: 90px;
      pointer-events: none;
      animation: floatStar 5s ease-in-out infinite;
    }

    @keyframes floatStar {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(14px) rotate(8deg);
      }
    }

    .home-wrap {
      position: relative;
      z-index: 1;
      width: min(980px, 100%);
    }

    .home-card {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1.05fr;
      gap: 34px;
      align-items: center;
      padding: 34px;
      border: 1px solid rgba(255, 170, 210, 0.7);
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.74);
      backdrop-filter: blur(14px);
      box-shadow:
        0 18px 50px rgba(210, 116, 160, 0.18),
        inset 0 0 0 1px rgba(255, 255, 255, 0.65);
    }

    .home-card::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px dashed rgba(255, 159, 203, 0.6);
      border-radius: 26px;
      pointer-events: none;
    }

    .home-card::after {
      content: "Dream Archive";
      position: absolute;
      top: -15px;
      left: 34px;
      padding: 6px 16px;
      border-radius: 999px;
      background: #fff7fb;
      color: #b46b91;
      font-size: 0.82rem;
      letter-spacing: 0.16em;
      box-shadow: 0 4px 14px rgba(210, 116, 160, 0.14);
    }

    .visual {
      position: relative;
    }

    .visual::before {
      content: "";
      position: absolute;
      left: -16px;
      bottom: -16px;
      width: 72%;
      height: 72%;
      border-radius: 28px;
      background: #ffd6e9;
      z-index: -1;
    }

    .visual::after {
      content: "";
      position: absolute;
      right: -12px;
      top: -12px;
      width: 82px;
      height: 82px;
      border: 1px solid rgba(255, 126, 182, 0.45);
      border-radius: 50%;
      z-index: -1;
    }

    .visual img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 28px;
      border: 10px solid white;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.13);
      object-fit: cover;
    }

    .content {
      position: relative;
      text-align: left;
      padding: 12px 6px;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 14px;
      color: #ff7eb6;
      font-size: 0.88rem;
      letter-spacing: 0.18em;
      font-weight: bold;
    }

    h1 {
      margin-bottom: 14px;
      color: #333;
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(2.3rem, 5vw, 4.4rem);
      font-weight: 300;
      line-height: 1.15;
      letter-spacing: 0.04em;
    }

    .intro {
      margin-bottom: 22px;
      color: #666;
      font-size: 1.02rem;
      line-height: 1.9;
    }

    .quote {
      position: relative;
      margin: 24px 0;
      padding: 18px 20px 18px 45px;
      border-left: 4px solid #ffb3d9;
      border-radius: 18px;
      background: linear-gradient(135deg, #fff0f7, #ffffff);
      color: #7a5a68;
      line-height: 1.8;
      box-shadow: 0 8px 20px rgba(255, 179, 217, 0.18);
    }

    .quote::before {
      content: "“";
      position: absolute;
      top: -18px;
      left: 12px;
      color: rgba(255, 126, 182, 0.28);
      font-family: 'Noto Serif KR', serif;
      font-size: 4rem;
    }

    nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 26px;
    }

    nav a {
      position: relative;
      display: block;
      min-height: 118px;
      padding: 18px 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 190, 220, 0.8);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.86);
      color: #444;
      text-decoration: none;
      box-shadow: 0 8px 22px rgba(210, 116, 160, 0.12);
      transition: all 0.3s ease;
    }

    nav a::before {
      content: "";
      position: absolute;
      right: -26px;
      bottom: -30px;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: rgba(255, 179, 217, 0.35);
      transition: all 0.3s ease;
    }

    nav a:hover {
      transform: translateY(-6px);
      border-color: #ff9fcb;
      box-shadow: 0 12px 28px rgba(210, 116, 160, 0.2);
    }

    nav a:hover::before {
      transform: scale(1.25);
      background: rgba(255, 159, 203, 0.5);
    }

    nav a:focus-visible {
      outline: 2px solid #ff7eb6;
      outline-offset: 3px;
    }

    .menu-number {
      display: block;
      margin-bottom: 12px;
      color: #d990b4;
      font-family: 'Noto Serif KR', serif;
      font-size: 0.9rem;
    }

    .menu-title {
      position: relative;
      z-index: 1;
      display: block;
      margin-bottom: 8px;
      color: #ff7eb6;
      font-size: 1.05rem;
      font-weight: bold;
      letter-spacing: 0.12em;
    }

    .menu-desc {
      position: relative;
      z-index: 1;
      display: block;
      color: #777;
      font-size: 0.88rem;
      line-height: 1.6;
    }

    .footer-note {
      margin-top: 22px;
      text-align: center;
      color: #b98aa1;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
    }

    .petal {
      position: fixed;
      width: 12px;
      height: 18px;
      border-radius: 50% 50% 50% 0;
      background: rgba(255, 179, 217, 0.45);
      pointer-events: none;
      animation: fall 9s linear infinite;
    }

    .petal.one {
      left: 12%;
      top: -30px;
      animation-delay: 0s;
    }

    .petal.two {
      left: 72%;
      top: -40px;
      animation-delay: 2.5s;
      animation-duration: 11s;
    }

    .petal.three {
      left: 88%;
      top: -20px;
      animation-delay: 5s;
      animation-duration: 10s;
    }

    @keyframes fall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      100% {
        transform: translateY(110vh) rotate(230deg);
        opacity: 0;
      }
    }

    @media (max-width: 820px) {
      body {
        align-items: flex-start;
      }

      .home-card {
        grid-template-columns: 1fr;
        padding: 26px;
      }

      .content {
        text-align: center;
      }

      .quote {
        text-align: left;
      }

      nav {
        grid-template-columns: 1fr;
      }

      nav a {
        min-height: auto;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 26px 14px;
      }

      .home-card {
        padding: 22px;
        border-radius: 26px;
      }

      .home-card::before {
        inset: 10px;
        border-radius: 20px;
      }

      .home-card::after {
        left: 24px;
        font-size: 0.72rem;
      }

      .visual img {
        border-width: 7px;
        border-radius: 22px;
      }

      .intro {
        font-size: 0.95rem;
      }

      .quote {
        font-size: 0.92rem;
      }

      .menu-title {
        font-size: 1rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <span class="petal one"></span>
  <span class="petal two"></span>
  <span class="petal three"></span>

  <main class="home-wrap">
    <section class="home-card" aria-label="Day의 드림홈 메인">

      <div class="visual">
        <img src="main.png" alt="Day의 드림홈 메인 이미지">
      </div>

      <div class="content">
        <span class="eyebrow">DAY'S DREAM HOME</span>

        <h1>Day의<br>드림홈</h1>

        <p class="intro">
          드림, 로그, 타임라인, 갤러리를 정리하는 작은 기록실.
          흩어진 장면들을 천천히 모아두는 공간입니다.
        </p>

        <div class="quote">
          파도가 쳐도 괜찮다. 너가 바다니까.
        </div>

        <nav aria-label="메인 메뉴">
          <a href="character.html">
            <span class="menu-number">01</span>
            <span class="menu-title">CHARACTER</span>
            <span class="menu-desc">인물 설정과 관계 정리</span>
          </a>

          <a href="timeline.html">
            <span class="menu-number">02</span>
            <span class="menu-title">TIMELINE</span>
            <span class="menu-desc">시간순 사건과 서사 흐름</span>
          </a>

          <a href="gallery.html">
            <span class="menu-number">03</span>
            <span class="menu-title">GALLERY</span>
            <span class="menu-desc">그림과 이미지 아카이브</span>
          </a>
        </nav>
      </div>
    </section>

    <p class="footer-note">✦ DREAM ARCHIVE / DAY ✦</p>
  </main>
</body>

</html>
