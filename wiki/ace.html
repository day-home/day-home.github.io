<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>에이스</title>

  <style>
    .fixed-home-link {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 999;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 14px;
    border: 1px solid rgba(255, 190, 220, 0.75);
    border-radius: 999px;
    background: rgba(255, 248, 252, 0.82);
    backdrop-filter: blur(12px);
    color: #9b4f75;
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.08em;
    box-shadow: 0 8px 22px rgba(80, 30, 60, 0.18);
    transition:
      transform 0.25s ease,
      box-shadow 0.25s ease,
      border-color 0.25s ease,
      background 0.25s ease;
  }
  
  .fixed-home-link:hover {
    transform: translateY(-3px);
    border-color: rgba(255, 159, 203, 0.95);
    background: rgba(255, 255, 255, 0.94);
    box-shadow: 0 12px 28px rgba(80, 30, 60, 0.24);
  }
  
  .fixed-home-link:focus-visible {
    outline: 2px solid #ff9fcb;
    outline-offset: 3px;
  }
  
  @media (max-width: 560px) {
    .fixed-home-link {
      top: 12px;
      left: 12px;
      padding: 8px 12px;
      font-size: 12px;
    }
  }
  </style>
</head>


<body>
  <a class="fixed-home-link" href="../index.html">← HOME</a>
  
  <main>
    <a href="../character.html">← 캐릭터 목록으로 돌아가기</a>
    <h1>에이스</h1>
    <p>누아에게 자유로운 신뢰 관계를 알려주는 인물.</p>
  </main>
</body>
</html>
