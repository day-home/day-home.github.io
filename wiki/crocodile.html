<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Nua & Crocodile Relation</title>
  <style>
    /* 기본 변수 설정 */
    :root {
      --pink-main: #ff80bf;
      --pink-soft: #ffb6de;
      --croc-dark: #050f0a;
      --croc-green: #145c30;
      --text-main: #f1e8f5;
    }

    body {
      background-color: #000;
      margin: 0;
      padding: 20px;
      font-family: 'Pretendard', sans-serif;
    }

    /* =================================================
       NUA RELATION SECTION - 뽀샤시 & 소용돌이 풀버전
    ================================================= */

    .nua-relation {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      margin: 40px auto;
      max-width: 900px;
      padding: 40px;
      border: 2px solid rgba(255, 182, 222, 0.4);
      border-radius: 40px;
      /* 배경: 딥그린과 보라가 섞인 어둠 */
      background: linear-gradient(145deg, #050f0a 0%, #0d051a 100%) !important;
      box-shadow: 0 0 50px rgba(255, 128, 191, 0.15);
    }

    /* [배경 효과 1] 강력한 소용돌이 */
    .nua-relation::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        from 0deg at 50% 50%,
        transparent 0deg,
        rgba(255, 128, 191, 0.2) 60deg,
        rgba(180, 100, 255, 0.15) 120deg,
        rgba(20, 92, 48, 0.2) 180deg,
        rgba(255, 182, 222, 0.15) 240deg,
        transparent 360deg
      );
      animation: relationSwirl 20s linear infinite;
      z-index: -2;
      filter: blur(40px);
    }

    /* [배경 효과 2] 핑크빛 안개 (뽀샤시함 담당) */
    .nua-pink-mist {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle at 70% 30%, 
        rgba(255, 200, 230, 0.2), 
        transparent 70%
      );
      pointer-events: none;
      z-index: -1;
    }

    /* [배경 효과 3] 오른쪽에서 쏟아지는 선명한 빛줄기 */
    .nua-relation::after {
      content: "";
      position: absolute;
      top: -10%;
      right: -10%;
      width: 50%;
      height: 120%;
      background: linear-gradient(
        110deg,
        transparent,
        rgba(255, 182, 222, 0.25) 40%,
        rgba(255, 255, 255, 0.15) 60%,
        transparent 100%
      );
      filter: blur(40px);
      transform: rotate(-15deg);
      z-index: -1;
      animation: nuaRightGlow 5s ease-in-out infinite alternate;
    }

    /* [내부 박스 디자인] 연한 핑크-보라 뽀샤시 박스 */
    .nua-relation .data-card, 
    .nua-relation .scene-box,
    .nua-relation .wiki-note {
      position: relative;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(255, 182, 222, 0.08) 50%,
        rgba(0, 0, 0, 0.3) 100%
      ) !important;
      border: 1px solid rgba(255, 255, 255, 0.3) !important;
      backdrop-filter: blur(12px) saturate(140%);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      color: #fff !important;
    }

    /* 텍스트 스타일 */
    .nua-relation h2 {
      font-size: 1.8em;
      color: #fff;
      text-shadow: 0 0 15px rgba(255, 128, 191, 1);
      margin-top: 0;
      border-bottom: 2px solid rgba(255, 182, 222, 0.6);
      display: inline-block;
      padding-bottom: 5px;
    }

    .nua-relation h3 {
      color: var(--pink-soft) !important;
      font-size: 1.3em;
      margin-bottom: 15px;
    }

    .nua-relation p, .nua-relation li {
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.95) !important;
      font-size: 1.05em;
    }

    /* 애니메이션 */
    @keyframes relationSwirl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes nuaRightGlow {
      from { opacity: 0.4; transform: rotate(-15deg) translateX(20px); }
      to { opacity: 1; transform: rotate(-15deg) translateX(-20px); }
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .nua-relation { padding: 20px; }
      .nua-relation::after { width: 80%; }
    }
  </style>
</head>
<body>

  <div class="nua-relation">
    <div class="nua-pink-mist"></div>

    <h2>Relationship: Nua & Crocodile</h2>

    <div class="data-card">
      <h3>🌸 누아 (Nua)</h3>
      <p>크로커다일의 어두운 세계에 갑작스럽게 나타난 존재. 그녀가 머무는 곳마다 딱딱했던 모래바람 대신 부드러운 핑크빛 안개가 감돈다.</p>
    </div>

    <div class="scene-box">
      <h3>🎬 주요 장면</h3>
      <ul>
        <li>모래 폭풍 속에서 혼자 핑크색 양산을 쓰고 걸어오는 누아.</li>
        <li>크로커다일의 서재 책상 위에 제멋대로 꽃병을 놓아두는 대담함.</li>
        <li>그의 서늘한 시선을 받아내며 환하게 웃어버리는 모습.</li>
      </ul>
    </div>

    <div class="wiki-note">
      <p>💡 <b>Note:</b> 크로커다일은 처음엔 그녀를 성가셔했으나, 어느덧 그녀의 핑크빛 소용돌이에 익숙해져 버린 듯하다.</p>
    </div>
  </div>

</body>
</html>
